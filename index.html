<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Recepción de Hormigón</title>
  <style>
    /* ── Tipografía y base ─────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --verde:   #1a7a3c;
      --rojo:    #c0392b;
      --azul:    #1565c0;
      --gris-bg: #f4f4f4;
      --gris-bd: #ccc;
      --radio:   10px;
      --sombra:  0 2px 8px rgba(0,0,0,.15);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 18px;
      background: var(--gris-bg);
      color: #222;
      min-height: 100dvh;
    }

    /* ── Pantallas ─────────────────────────────────────── */
    .pantalla { display: none; padding: 20px; max-width: 520px; margin: 0 auto; }
    .pantalla.activa { display: block; }

    /* ── Cabecera ──────────────────────────────────────── */
    header {
      background: var(--azul);
      color: #fff;
      padding: 14px 20px;
      font-size: 1.2rem;
      font-weight: 700;
      text-align: center;
      letter-spacing: .5px;
      position: sticky; top: 0; z-index: 10;
    }
    header small { font-size: .75rem; font-weight: 400; display: block; opacity: .85; }

    /* ── Tarjeta ───────────────────────────────────────── */
    .tarjeta {
      background: #fff;
      border-radius: var(--radio);
      box-shadow: var(--sombra);
      padding: 20px;
      margin-bottom: 16px;
    }
    .tarjeta h2 { font-size: 1.1rem; color: var(--azul); margin-bottom: 14px; }

    /* ── Formulario ────────────────────────────────────── */
    label { display: block; font-weight: 600; margin-bottom: 4px; margin-top: 14px; }
    label:first-of-type { margin-top: 0; }
    input[type="text"], input[type="number"], input[type="time"] {
      width: 100%;
      padding: 14px 12px;
      font-size: 1.1rem;
      border: 2px solid var(--gris-bd);
      border-radius: var(--radio);
      background: #fafafa;
      -webkit-appearance: none;
    }
    input:focus { outline: none; border-color: var(--azul); background: #fff; }

    /* ── Botones ───────────────────────────────────────── */
    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      margin-top: 18px;
      font-size: 1.15rem;
      font-weight: 700;
      border: none;
      border-radius: var(--radio);
      cursor: pointer;
      text-align: center;
      letter-spacing: .3px;
    }
    .btn-primario  { background: var(--azul);  color: #fff; }
    .btn-verde     { background: var(--verde);  color: #fff; }
    .btn-rojo      { background: var(--rojo);   color: #fff; }
    .btn-gris      { background: #757575;       color: #fff; }
    .btn-secundario{ background: #e0e0e0;       color: #333; }
    .btn:active    { filter: brightness(.88); }

    /* ── Resultado ─────────────────────────────────────── */
    .resultado-box {
      border-radius: var(--radio);
      padding: 20px;
      text-align: center;
      margin-bottom: 16px;
    }
    .resultado-box.aceptado { background: #e8f5e9; border: 3px solid var(--verde); }
    .resultado-box.rechazado { background: #ffebee; border: 3px solid var(--rojo); }
    .resultado-titulo { font-size: 2rem; font-weight: 900; }
    .aceptado .resultado-titulo { color: var(--verde); }
    .rechazado .resultado-titulo { color: var(--rojo); }
    .motivos { text-align: left; margin-top: 12px; font-size: 1rem; }
    .motivos li { margin-bottom: 6px; margin-left: 18px; }

    /* ── Resumen albarán ───────────────────────────────── */
    .resumen-fila { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid #eee; font-size: .97rem; }
    .resumen-fila:last-child { border-bottom: none; }
    .resumen-label { color: #555; }
    .resumen-valor { font-weight: 600; }

    /* ── Historial ─────────────────────────────────────── */
    .historial-item {
      border-radius: var(--radio);
      padding: 14px;
      margin-bottom: 10px;
      border-left: 6px solid;
      background: #fff;
      box-shadow: var(--sombra);
    }
    .historial-item.aceptado { border-color: var(--verde); }
    .historial-item.rechazado { border-color: var(--rojo); }
    .hist-cabecera { display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
    .hist-badge { font-size: .8rem; padding: 3px 8px; border-radius: 20px; color: #fff; }
    .hist-badge.aceptado  { background: var(--verde); }
    .hist-badge.rechazado { background: var(--rojo);  }
    .hist-detalle { font-size: .88rem; color: #555; margin-top: 6px; }

    /* ── Pedido activo (banner) ─────────────────────────── */
    .banner-pedido {
      background: var(--azul);
      color: #fff;
      border-radius: var(--radio);
      padding: 10px 14px;
      margin-bottom: 16px;
      font-size: .95rem;
    }
    .banner-pedido strong { font-size: 1.05rem; }

    /* ── Misc ───────────────────────────────────────────── */
    .seccion-titulo { font-size: 1rem; color: #555; font-weight: 600; margin: 8px 0 6px; }
    .vacio { text-align: center; color: #888; padding: 30px 0; font-size: 1rem; }
    .separador { border: none; border-top: 1px solid #ddd; margin: 14px 0; }
    .contador-badge {
      display: inline-block;
      background: var(--azul);
      color: #fff;
      border-radius: 20px;
      padding: 2px 10px;
      font-size: .85rem;
      margin-left: 6px;
    }
  </style>
</head>
<body>

<header id="cabecera-header">
  Recepción de Hormigón
  <small id="subtitulo-header"></small>
</header>

<!-- ══════════════════════════════════════════════════════ -->
<!--  PANTALLA 1 — Pedido del día                          -->
<!-- ══════════════════════════════════════════════════════ -->
<div id="pant-pedido" class="pantalla activa">
  <div class="tarjeta">
    <h2>Pedido del día</h2>
    <label for="p-tipo">Tipo de hormigón pedido</label>
    <input type="text" id="p-tipo" placeholder="ej. HA-25/B/20/IIa" autocomplete="off" autocorrect="off" spellcheck="false" />

    <label for="p-cono">Cono de Abrams pedido (cm)</label>
    <input type="number" id="p-cono" placeholder="ej. 9" min="0" max="30" step="1" />
  </div>

  <button class="btn btn-primario" onclick="iniciarJornada()">Iniciar jornada ▶</button>
  <div id="pedido-error" style="color:var(--rojo);margin-top:10px;font-weight:600;display:none;"></div>
</div>

<!-- ══════════════════════════════════════════════════════ -->
<!--  PANTALLA 2 — Registro de albarán                     -->
<!-- ══════════════════════════════════════════════════════ -->
<div id="pant-albaran" class="pantalla">
  <div id="banner-pedido-albaran" class="banner-pedido"></div>

  <div class="tarjeta">
    <h2>Nuevo albarán</h2>

    <label for="a-numero">Número de albarán</label>
    <input type="text" id="a-numero" placeholder="ej. 00234" autocomplete="off" inputmode="text" />

    <label for="a-tipo">Hormigón en albarán</label>
    <input type="text" id="a-tipo" placeholder="ej. HA-25/B/20/IIa" autocomplete="off" autocorrect="off" spellcheck="false" />

    <label for="a-salida">Hora de salida de planta</label>
    <input type="time" id="a-salida" />

    <label for="a-llegada">Hora de llegada a obra</label>
    <input type="time" id="a-llegada" />

    <label for="a-m3">Metros cúbicos (m³)</label>
    <input type="number" id="a-m3" placeholder="ej. 7.5" min="0" step="0.1" />

    <label for="a-cono">Cono de Abrams medido (cm)</label>
    <input type="number" id="a-cono" placeholder="ej. 8" min="0" max="30" step="1" />

    <label for="a-temp">Temperatura ambiente (°C)</label>
    <input type="number" id="a-temp" placeholder="ej. 22" min="-20" max="60" step="1" />
  </div>

  <div id="albaran-error" style="color:var(--rojo);margin-bottom:10px;font-weight:600;display:none;"></div>
  <button class="btn btn-primario" onclick="evaluarAlbaran()">Evaluar ▶</button>
  <button class="btn btn-secundario" onclick="irAHistorial()">Ver historial</button>
</div>

<!-- ══════════════════════════════════════════════════════ -->
<!--  PANTALLA 3 — Resultado                               -->
<!-- ══════════════════════════════════════════════════════ -->
<div id="pant-resultado" class="pantalla">
  <div id="resultado-box" class="resultado-box">
    <div class="resultado-titulo" id="resultado-titulo"></div>
    <ul class="motivos" id="resultado-motivos"></ul>
  </div>

  <div class="tarjeta">
    <h2>Resumen del albarán</h2>
    <div id="resumen-contenido"></div>
  </div>

  <button class="btn btn-verde" onclick="siguienteAlbaran()">Siguiente albarán ▶</button>
  <button class="btn btn-secundario" onclick="irAHistorial()">Ver historial</button>
</div>

<!-- ══════════════════════════════════════════════════════ -->
<!--  PANTALLA 4 — Historial                               -->
<!-- ══════════════════════════════════════════════════════ -->
<div id="pant-historial" class="pantalla">
  <div id="banner-pedido-historial" class="banner-pedido"></div>

  <div style="display:flex;gap:8px;margin-bottom:8px;">
    <button class="btn btn-verde" style="margin-top:0;flex:1;" onclick="exportarCSV()">Exportar CSV</button>
    <button class="btn btn-rojo"  style="margin-top:0;flex:1;" onclick="confirmarNuevaJornada()">Nueva jornada</button>
  </div>
  <button class="btn btn-secundario" style="margin-top:0;margin-bottom:16px;" onclick="irAAlbaran()">← Volver</button>

  <div id="historial-lista"></div>
</div>

<!-- ══════════════════════════════════════════════════════ -->
<!--  JAVASCRIPT                                           -->
<!-- ══════════════════════════════════════════════════════ -->
<script>
"use strict";

/* ────────────────────────────────────────────────────────
   CONSTANTES
──────────────────────────────────────────────────────── */
const TIEMPO_MAX_MIN = 90;            // Regla 1: minutos máximos
const TOLERANCIA_CONO_CM = 2;        // Regla 2: tolerancia cono (±)
const TEMP_MIN_C = 5;                // Regla 4: temperatura mínima
const TEMP_MAX_C = 35;               // Regla 4: temperatura máxima
const CLAVE_ESTADO = "recepcion_estado"; // clave localStorage

/* ────────────────────────────────────────────────────────
   ESTADO (se persiste en localStorage)
──────────────────────────────────────────────────────── */
let estado = {
  pedidoTipo: "",     // tipo de hormigón pedido
  pedidoCono: null,   // cono pedido en cm
  historial: []       // array de albaranes evaluados
};

/* ────────────────────────────────────────────────────────
   PERSISTENCIA
──────────────────────────────────────────────────────── */
function guardarEstado() {
  localStorage.setItem(CLAVE_ESTADO, JSON.stringify(estado));
}

function cargarEstado() {
  const raw = localStorage.getItem(CLAVE_ESTADO);
  if (raw) {
    try { estado = JSON.parse(raw); } catch (_) { /* corrupción: ignorar */ }
  }
}

/* ────────────────────────────────────────────────────────
   REGLAS DE DECISIÓN
   Recibe los datos del albarán y el pedido del día.
   Devuelve { aceptado: bool, motivos: string[] }
──────────────────────────────────────────────────────── */
function evaluarReglas({ tipoAlbaran, tiposPedido, conoMedido, conoPedido, minutosTransporte, temperatura }) {
  const motivos = [];

  // Regla 1 — Tiempo máximo de transporte
  if (minutosTransporte > TIEMPO_MAX_MIN) {
    motivos.push(
      `Tiempo de transporte excedido (${minutosTransporte} min > ${TIEMPO_MAX_MIN} min)`
    );
  }

  // Regla 2 — Cono de Abrams (tolerancia ±2 cm)
  const diferenciaCono = Math.abs(conoMedido - conoPedido);
  if (diferenciaCono > TOLERANCIA_CONO_CM) {
    motivos.push(
      `Cono fuera de tolerancia (medido: ${conoMedido} cm, pedido: ${conoPedido} cm, diferencia: ${diferenciaCono} cm)`
    );
  }

  // Regla 3 — Tipo de hormigón (sin mayúsculas ni espacios)
  function normalizar(txt) { return txt.toLowerCase().replace(/\s+/g, ""); }
  if (normalizar(tipoAlbaran) !== normalizar(tiposPedido)) {
    motivos.push(
      `Tipo de hormigón no coincide (albarán: ${tipoAlbaran}, pedido: ${tiposPedido})`
    );
  }

  // Regla 4 — Temperatura ambiente (5 °C ≤ temp ≤ 35 °C)
  if (temperatura < TEMP_MIN_C || temperatura > TEMP_MAX_C) {
    motivos.push(
      `Temperatura fuera de rango (${temperatura} °C)`
    );
  }

  return { aceptado: motivos.length === 0, motivos };
}

/* ────────────────────────────────────────────────────────
   UTILIDADES
──────────────────────────────────────────────────────── */
function tiempoAMinutos(hhmm) {
  const [h, m] = hhmm.split(":").map(Number);
  return h * 60 + m;
}

function calcularMinutos(salida, llegada) {
  let diff = tiempoAMinutos(llegada) - tiempoAMinutos(salida);
  if (diff < 0) diff += 24 * 60; // cruce de medianoche
  return diff;
}

function mostrar(id) {
  document.querySelectorAll(".pantalla").forEach(p => p.classList.remove("activa"));
  document.getElementById(id).classList.add("activa");
  window.scrollTo(0, 0);
}

function mostrarError(idDiv, msg) {
  const el = document.getElementById(idDiv);
  el.textContent = msg;
  el.style.display = "block";
}

function ocultarError(idDiv) {
  document.getElementById(idDiv).style.display = "none";
}

function actualizarBanners() {
  const txt = `<strong>${estado.pedidoTipo}</strong> · Cono pedido: <strong>${estado.pedidoCono} cm</strong>`;
  document.getElementById("banner-pedido-albaran").innerHTML = txt;
  document.getElementById("banner-pedido-historial").innerHTML = txt;
  document.getElementById("subtitulo-header").textContent =
    estado.pedidoTipo ? `${estado.pedidoTipo} · cono ${estado.pedidoCono} cm` : "";
}

/* ────────────────────────────────────────────────────────
   PANTALLA 1 — Iniciar jornada
──────────────────────────────────────────────────────── */
function iniciarJornada() {
  ocultarError("pedido-error");
  const tipo = document.getElementById("p-tipo").value.trim();
  const cono = parseFloat(document.getElementById("p-cono").value);

  if (!tipo) { mostrarError("pedido-error", "Introduce el tipo de hormigón pedido."); return; }
  if (isNaN(cono) || cono < 0) { mostrarError("pedido-error", "Introduce el cono pedido en cm."); return; }

  estado.pedidoTipo = tipo;
  estado.pedidoCono = cono;
  estado.historial = [];
  guardarEstado();
  actualizarBanners();
  limpiarFormularioAlbaran();
  mostrar("pant-albaran");
}

/* ────────────────────────────────────────────────────────
   PANTALLA 2 — Evaluar albarán
──────────────────────────────────────────────────────── */
function evaluarAlbaran() {
  ocultarError("albaran-error");

  const numero  = document.getElementById("a-numero").value.trim();
  const tipo    = document.getElementById("a-tipo").value.trim();
  const salida  = document.getElementById("a-salida").value;
  const llegada = document.getElementById("a-llegada").value;
  const m3raw   = document.getElementById("a-m3").value;
  const conoRaw = document.getElementById("a-cono").value;
  const tempRaw = document.getElementById("a-temp").value;

  // Validaciones básicas
  if (!numero)  { mostrarError("albaran-error", "Introduce el número de albarán."); return; }
  if (!tipo)    { mostrarError("albaran-error", "Introduce el tipo de hormigón del albarán."); return; }
  if (!salida)  { mostrarError("albaran-error", "Introduce la hora de salida de planta."); return; }
  if (!llegada) { mostrarError("albaran-error", "Introduce la hora de llegada a obra."); return; }
  if (m3raw === "") { mostrarError("albaran-error", "Introduce los m³."); return; }
  if (conoRaw === "") { mostrarError("albaran-error", "Introduce el cono de Abrams medido."); return; }
  if (tempRaw === "") { mostrarError("albaran-error", "Introduce la temperatura ambiente."); return; }

  const m3         = parseFloat(m3raw);
  const conoMedido = parseFloat(conoRaw);
  const temperatura = parseFloat(tempRaw);
  const minutos    = calcularMinutos(salida, llegada);

  if (isNaN(m3) || m3 <= 0) { mostrarError("albaran-error", "Los m³ deben ser un número positivo."); return; }
  if (isNaN(conoMedido) || conoMedido < 0) { mostrarError("albaran-error", "El cono medido debe ser un número ≥ 0."); return; }
  if (isNaN(temperatura)) { mostrarError("albaran-error", "La temperatura debe ser un número."); return; }

  // Aplicar reglas
  const { aceptado, motivos } = evaluarReglas({
    tipoAlbaran:     tipo,
    tiposPedido:     estado.pedidoTipo,
    conoMedido:      conoMedido,
    conoPedido:      estado.pedidoCono,
    minutosTransporte: minutos,
    temperatura:     temperatura
  });

  // Guardar en historial
  const registro = { numero, tipo, salida, llegada, m3, conoMedido, temperatura, minutos, aceptado, motivos };
  estado.historial.push(registro);
  guardarEstado();

  // Mostrar resultado
  mostrarResultado(registro);
}

/* ────────────────────────────────────────────────────────
   PANTALLA 3 — Mostrar resultado
──────────────────────────────────────────────────────── */
function mostrarResultado(reg) {
  const box = document.getElementById("resultado-box");
  box.className = "resultado-box " + (reg.aceptado ? "aceptado" : "rechazado");

  document.getElementById("resultado-titulo").textContent =
    reg.aceptado ? "✅ ACEPTADO" : "❌ RECHAZADO";

  const ul = document.getElementById("resultado-motivos");
  ul.innerHTML = "";
  if (reg.aceptado) {
    ul.innerHTML = "<li>Todas las comprobaciones correctas.</li>";
  } else {
    reg.motivos.forEach(m => {
      const li = document.createElement("li");
      li.textContent = m;
      ul.appendChild(li);
    });
  }

  // Resumen
  document.getElementById("resumen-contenido").innerHTML = `
    <div class="resumen-fila"><span class="resumen-label">Albarán</span><span class="resumen-valor">${reg.numero}</span></div>
    <div class="resumen-fila"><span class="resumen-label">Hormigón albarán</span><span class="resumen-valor">${reg.tipo}</span></div>
    <div class="resumen-fila"><span class="resumen-label">Pedido del día</span><span class="resumen-valor">${estado.pedidoTipo}</span></div>
    <div class="resumen-fila"><span class="resumen-label">Salida de planta</span><span class="resumen-valor">${reg.salida}</span></div>
    <div class="resumen-fila"><span class="resumen-label">Llegada a obra</span><span class="resumen-valor">${reg.llegada}</span></div>
    <div class="resumen-fila"><span class="resumen-label">Tiempo transporte</span><span class="resumen-valor">${reg.minutos} min</span></div>
    <div class="resumen-fila"><span class="resumen-label">m³</span><span class="resumen-valor">${reg.m3}</span></div>
    <div class="resumen-fila"><span class="resumen-label">Cono medido</span><span class="resumen-valor">${reg.conoMedido} cm</span></div>
    <div class="resumen-fila"><span class="resumen-label">Cono pedido</span><span class="resumen-valor">${estado.pedidoCono} cm</span></div>
    <div class="resumen-fila"><span class="resumen-label">Temperatura ambiente</span><span class="resumen-valor">${reg.temperatura} °C</span></div>
  `;

  mostrar("pant-resultado");
}

/* ────────────────────────────────────────────────────────
   PANTALLA 4 — Historial
──────────────────────────────────────────────────────── */
function irAHistorial() {
  const lista = document.getElementById("historial-lista");
  lista.innerHTML = "";

  if (estado.historial.length === 0) {
    lista.innerHTML = '<div class="vacio">No hay albaranes registrados aún.</div>';
  } else {
    // Mostrar del más reciente al más antiguo
    [...estado.historial].reverse().forEach((reg, i) => {
      const idx = estado.historial.length - i; // número de orden (1-based)
      const cls = reg.aceptado ? "aceptado" : "rechazado";
      const badgeTxt = reg.aceptado ? "ACEPTADO" : "RECHAZADO";
      const motivosTxt = reg.aceptado
        ? ""
        : `<div class="hist-detalle">${reg.motivos.map(m => "• " + m).join("<br>")}</div>`;
      lista.innerHTML += `
        <div class="historial-item ${cls}">
          <div class="hist-cabecera">
            <span>#${idx} · Albarán ${reg.numero}</span>
            <span class="hist-badge ${cls}">${badgeTxt}</span>
          </div>
          <div class="hist-detalle">${reg.tipo} · ${reg.salida}→${reg.llegada} (${reg.minutos} min) · ${reg.m3} m³ · cono ${reg.conoMedido} cm · ${reg.temperatura} °C</div>
          ${motivosTxt}
        </div>`;
    });
  }

  actualizarBanners();
  mostrar("pant-historial");
}

function irAAlbaran() {
  limpiarFormularioAlbaran();
  mostrar("pant-albaran");
}

/* ────────────────────────────────────────────────────────
   EXPORTAR CSV
──────────────────────────────────────────────────────── */
function exportarCSV() {
  if (estado.historial.length === 0) {
    alert("No hay albaranes para exportar.");
    return;
  }

  const cabecera = [
    "Orden", "Nº Albarán", "Hormigón Albarán", "Hormigón Pedido",
    "Cono Pedido (cm)", "Hora Salida", "Hora Llegada",
    "Tiempo (min)", "m³", "Cono Medido (cm)", "Temperatura (°C)", "Resultado", "Motivos"
  ];

  const filas = estado.historial.map((reg, i) => [
    i + 1,
    reg.numero,
    reg.tipo,
    estado.pedidoTipo,
    estado.pedidoCono,
    reg.salida,
    reg.llegada,
    reg.minutos,
    reg.m3,
    reg.conoMedido,
    reg.temperatura,
    reg.aceptado ? "ACEPTADO" : "RECHAZADO",
    reg.motivos.join(" | ")
  ]);

  const csvContent = [cabecera, ...filas]
    .map(fila => fila.map(v => `"${String(v).replace(/"/g, '""')}"`).join(";"))
    .join("\n");

  const blob = new Blob(["\uFEFF" + csvContent], { type: "text/csv;charset=utf-8;" });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement("a");
  const fecha = new Date().toISOString().slice(0, 10);
  a.href     = url;
  a.download = `hormigon_${fecha}.csv`;
  a.click();
  URL.revokeObjectURL(url);
}

/* ────────────────────────────────────────────────────────
   NUEVA JORNADA
──────────────────────────────────────────────────────── */
function confirmarNuevaJornada() {
  if (!confirm("¿Seguro que quieres iniciar una nueva jornada?\nSe borrará el historial actual (exporta primero si lo necesitas).")) return;
  estado = { pedidoTipo: "", pedidoCono: null, historial: [] };
  guardarEstado();
  document.getElementById("p-tipo").value = "";
  document.getElementById("p-cono").value = "";
  mostrar("pant-pedido");
}

/* ────────────────────────────────────────────────────────
   HELPERS DE NAVEGACIÓN
──────────────────────────────────────────────────────── */
function siguienteAlbaran() {
  limpiarFormularioAlbaran();
  mostrar("pant-albaran");
}

function limpiarFormularioAlbaran() {
  ["a-numero", "a-tipo", "a-salida", "a-llegada", "a-m3", "a-cono", "a-temp"]
    .forEach(id => { document.getElementById(id).value = ""; });
  ocultarError("albaran-error");
}

/* ────────────────────────────────────────────────────────
   ARRANQUE — restaurar estado al abrir la página
──────────────────────────────────────────────────────── */
(function init() {
  cargarEstado();
  if (estado.pedidoTipo) {
    // Hay una jornada en curso: ir directamente al formulario de albarán
    actualizarBanners();
    mostrar("pant-albaran");
  } else {
    mostrar("pant-pedido");
  }
})();
</script>
</body>
</html>
